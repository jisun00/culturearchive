<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="관람기록">
<meta name="theme-color" content="#ffffff">
<title>관람기록</title>
<style>
:root{
  --bg:#ffffff;      /* 페이지 배경 */
  --surf:#f5f7fa;    /* 카드·패널 */
  --surf2:#e8ecf3;   /* 보조 버튼·트랙 */
  --line:#d9e0ea;    /* 입력 테두리 */
  --line2:#edf0f5;   /* 구분선 */
  --tx:#171a20;      /* 본문 */
  --tx2:#454d5c;     /* 보조 본문 */
  --mut:#5c6473;     /* 라벨 */
  --mut2:#7b8393;    /* 흐린 글씨 */
  --acc:#2f63e8;     /* 강조 */
  --dan:#c0344a; --danbg:#fdeaee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:88px}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 18px;letter-spacing:-.5px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--line);z-index:50}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:14px;font-weight:600;padding:16px 0 22px;font-family:inherit}
.tabs button.on{color:var(--acc)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead b{font-size:20px}
.nav{background:var(--surf2);border:0;color:var(--tx);font-size:22px;width:46px;height:46px;border-radius:14px}
/* 달력만 좌우 여백(.wrap의 16px)을 없애 날짜 칸을 최대한 넓게 쓴다 */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin:0 -16px 4px}
.dow div{text-align:center;font-size:14px;color:var(--mut);padding:5px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin:0 -16px}
.cell{aspect-ratio:1/1.6;background:var(--bg);border-radius:0;position:relative;overflow:hidden;border:0;padding:0}
.cell.out{opacity:.35}
/* 날짜 숫자는 흰 배경 위에서도, 포스터 위에서도 읽혀야 하므로 반투명 흰 칩을 깐다 */
.cell .n{position:absolute;top:2px;left:4px;font-size:13px;font-weight:700;color:var(--tx);z-index:2}
.cell .imgs{position:absolute;inset:0;display:flex}
.cell .imgs.v{flex-direction:column}
.cell .imgs>i{flex:1;background-size:cover;background-position:center;background-color:var(--surf2)}
.cell .cnt{position:absolute;bottom:2px;right:2px;font-size:10px;background:var(--acc);color:#fff;border-radius:8px;padding:1px 6px;font-weight:700;z-index:2}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
/* 입력 폼: 항목명과 입력칸을 한 줄에 배치해 스크롤을 줄인다 */
.fr{display:flex;align-items:center;gap:10px;margin-top:10px}
.fr>label{flex:none;width:60px;margin:0;font-size:15px;color:var(--mut);line-height:1.3}
.fr>input,.fr>select,.fr>textarea,.fr>.dtrow,.fr>.drop,.fr>.qt{flex:1;min-width:0;margin:0}
.fr.top{align-items:flex-start}
.fr.top>label{padding-top:16px}
.fr>label.chk{width:auto;flex:1;margin:0;font-size:15px;color:var(--tx)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:14px;font-size:16px;font-family:inherit;line-height:20px;height:52px}
textarea{min-height:80px;height:auto;resize:vertical}
.dtrow{display:flex;gap:8px}
.dtrow input[type=date]{flex:1.3;min-width:0}
.dtrow input[type=time]{flex:1;min-width:0}
.qt{display:flex;gap:8px;margin-top:8px}
.qt button{flex:1;background:var(--surf2);border:0;color:var(--tx2);border-radius:10px;padding:12px 0;font-size:15px;font-weight:600;font-family:inherit}
input[type=date],input[type=time],input[type=datetime-local]{
  -webkit-appearance:none;appearance:none;display:block;
  min-height:52px;max-height:52px;text-align:left}
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0;height:20px;line-height:20px}
input[type=datetime-local]::-webkit-calendar-picker-indicator{opacity:.55}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;font-family:inherit;margin-top:18px}
.btn.sub{background:var(--surf2);color:var(--tx);margin-top:10px}
.btn.dan{background:var(--danbg);color:var(--dan)}
/* + 는 글자가 아니라 SVG. 글자로 두면 폰트 기준선 때문에 원 중앙에서 미세하게 어긋난다 */
.fab{position:fixed;right:calc(50% - 260px + 16px);bottom:96px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;border:0;padding:0;z-index:40;box-shadow:0 6px 18px #2f63e840;
  display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px;display:block}
@media(max-width:552px){.fab{right:16px}}
/* 홈 화면 앱(.pwa)은 사파리 하단 툴바가 없어 탭바가 화면 맨 아래에 붙는다.
   아래 여백을 키워 글자를 위로 올린다. 높이 조절은 --lift 한 값만 바꾸면 된다 */
.pwa{--lift:20px}
.pwa .tabs button{padding:16px 0 calc(22px + var(--lift))}
.pwa body{padding-bottom:calc(88px + var(--lift))}
.pwa .fab{bottom:calc(96px + var(--lift))}
.modal{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;display:none}
.modal.on{display:block}
.mbox{max-width:520px;margin:0 auto;padding:20px 16px 40px}
/* 모달 상단 바는 스크롤해도 붙어 있게 한다(저장·닫기 버튼이 항상 보이도록) */
.mtop{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:-20px -16px 6px;padding:20px 16px 10px;border-bottom:1px solid var(--line2)}
.mtop b{font-size:20px;word-break:break-all;min-width:0}
.mact{display:flex;gap:8px;flex:none}
.save{background:var(--acc);color:#fff;border:0;border-radius:14px;height:44px;padding:0 18px;font-size:16px;font-weight:700;font-family:inherit;flex:none}
.x{background:var(--surf2);border:0;color:var(--tx);width:44px;height:44px;border-radius:14px;font-size:20px;flex:none}
.card{background:var(--surf);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.card img{width:50px;height:80px;object-fit:cover;background:var(--surf2);flex:none} /* 포스터 비율 1:1.6 */
.card .bd{min-width:0;flex:1}
.card .t{font-size:16px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s+.s{margin-top:2px}
.card .cp{flex:none;background:var(--surf2);border:0;color:var(--tx2);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;font-family:inherit}
.card.det{align-items:flex-start}
.card.det img{width:72px;height:115px} /* 포스터 비율 1:1.6 */
.card.det .s{margin-top:3px;line-height:1.35}
.card.det .cp{align-self:center}
.card .s .k{display:inline-block;width:34px;color:var(--mut2)}
.hero{display:block;max-width:100%;max-height:37vh;width:auto;margin:0 auto 12px;background:var(--surf2)}
.dtitle{font-size:19px;font-weight:700;text-align:center;margin:0 0 10px;line-height:1.35;word-break:break-all}
.row{display:flex;padding:9px 2px;border-bottom:1px solid var(--line2);font-size:15px;gap:12px}
.row span{color:var(--mut);flex:none;width:60px}
.row b{font-weight:600;text-align:left;word-break:break-all;flex:1;min-width:0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mut);font-size:15px}
.drop.has{padding:10px}
.drop img{max-width:100%;max-height:22vh;width:auto;display:block;margin:0 auto}
.chk{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0 0;color:var(--tx);font-size:15px}
.chk input[type=checkbox]{width:20px;height:20px;min-height:20px;max-height:20px;flex:none;accent-color:var(--acc);margin:0;padding:0}
.gray{filter:grayscale(1);opacity:.72}
.stat{background:var(--surf);border-radius:16px;padding:16px;margin-bottom:12px}
.stat h3{margin:0 0 12px;font-size:16px;color:var(--mut);font-weight:600}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:14px}
.bar .lb{width:78px;flex:none;color:var(--tx2)}
.bar .tr{flex:1;background:var(--surf2);height:22px;border-radius:6px}
.bar .fi{height:100%;background:linear-gradient(90deg,#2f63e8,#8b5cf6);border-radius:6px}
.bar .vl{flex:none;font-size:13px;color:var(--mut);min-width:52px;text-align:right}
.ico{display:flex;gap:8px}
.ico button{background:var(--surf2);border:0;color:var(--tx2);width:44px;height:44px;border-radius:13px;padding:0;display:flex;align-items:center;justify-content:center}
.ico button.dan{background:var(--danbg);color:var(--dan)}
.ico svg{width:21px;height:21px;display:block}
.zoom{position:fixed;inset:0;background:#000000f2;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.zoom img{max-width:100%;max-height:100%}
.msum{margin-top:12px;background:var(--surf);border-radius:12px;padding:12px 16px;display:flex;align-items:center;font-size:14px;color:var(--mut)}
.msum b{color:var(--tx);font-size:16px;font-weight:700;margin-left:6px}
.msum i{flex:1}
.big{display:flex;gap:10px;margin-bottom:12px}
.big div{flex:1;background:var(--surf);border-radius:16px;padding:16px;text-align:center}
.big .k{font-size:12px;color:var(--mut)}
.big .v{font-size:22px;font-weight:800;margin-top:4px}
.seg{display:flex;background:var(--surf);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;color:var(--mut);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px #00000014}
.empty{text-align:center;color:var(--mut2);padding:50px 0;font-size:15px;line-height:1.7}
.sbar{display:flex;gap:8px;margin-bottom:12px}
.sbar input{flex:1}
.sbar button{flex:none;width:52px;background:var(--surf2);border:0;color:var(--tx);border-radius:12px;font-size:18px}
.sbar button.act{background:var(--acc);color:#fff}
.fpanel{background:var(--surf);border-radius:16px;padding:4px 16px 16px;margin-bottom:12px;display:none}
.fpanel.on{display:block}
.mono{font-size:13px;color:var(--mut);margin-bottom:10px;line-height:1.6}
.ym{display:flex;gap:8px}
.ym select{flex:1}
</style>
<div class="wrap"><div id="app"><div class="empty">불러오는 중…</div></div></div>
<button class="fab" onclick="openForm()" aria-label="기록 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4.5v15M4.5 12h15"/></svg></button>
<div class="tabs">
  <button id="t0" class="on" onclick="go(0)">달력</button>
  <button id="t1" onclick="go(1)">목록</button>
  <button id="t2" onclick="go(2)">통계</button>
  <button id="t3" onclick="go(3)">더보기</button>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbody"></div></div>
<script>
/* 엑셀 라이브러리(약 1MB)는 첫 화면에 필요 없으므로 실제로 쓸 때만 내려받는다 */
let _xp=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return _xp||(_xp=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res;
    s.onerror=()=>{_xp=null;rej()};
    document.head.appendChild(s);
  }));
}
async function needXLSX(){
  try{await loadXLSX();return true}
  catch(e){alert('엑셀 기능을 불러오지 못했습니다.\n인터넷 연결을 확인해주세요.');return false}
}
let DB=[],tab=0,cy=new Date().getFullYear(),cm=new Date().getMonth(),editId=null,tmpImg='';
let q='',fOpen=false,fGenre='',fVendor='',fY='',fSort='new',limit=40,sy='all';
const won=n=>(+n||0).toLocaleString('ko-KR');
// toISOString은 UTC 기준이라 새벽에 하루 밀린다. 오늘 날짜는 로컬 기준으로 만든다
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- IndexedDB ---------- */
let _db=null;
function idb(){
  return _db?Promise.resolve(_db):new Promise((res,rej)=>{
    const r=indexedDB.open('showlog',1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('recs'))d.createObjectStore('recs',{keyPath:'id'})};
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=()=>rej(r.error);
  });
}
function tx(mode){return idb().then(d=>d.transaction('recs',mode).objectStore('recs'))}
function getAll(){return tx('readonly').then(s=>new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}))}
function put(o){return tx('readwrite').then(s=>new Promise((res,rej)=>{const r=s.put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}))}
function rm(id){return tx('readwrite').then(s=>new Promise((res,rej)=>{const r=s.delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}))}

async function load(){
  try{DB=await getAll()}
  catch(e){document.getElementById('app').innerHTML='<div class="empty">저장소를 열 수 없습니다.<br>사생활 보호 모드에서는 동작하지 않습니다.</div>';return}
  try{
    const old=localStorage.getItem('shows:v1');
    if(old){
      const arr=JSON.parse(old);
      if(Array.isArray(arr)&&arr.length){
        const ids=new Set(DB.map(x=>x.id));
        for(const x of arr)if(x&&x.id&&!ids.has(x.id)){await put(x);DB.push(x)}
      }
      localStorage.removeItem('shows:v1');
    }
  }catch(e){}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  render();
}
function go(t){tab=t;limit=40;[0,1,2,3].forEach(i=>document.getElementById('t'+i).className=i==t?'on':'');render();window.scrollTo(0,0)}
function render(){document.getElementById('app').innerHTML=[cal,list,stats,more][tab]()}

/* ---------- 달력 ---------- */
function ofDay(d){return DB.filter(x=>x.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function cal(){
  const start=(new Date(cy,cm,1).getDay()+6)%7,days=new Date(cy,cm+1,0).getDate(),prev=new Date(cy,cm,0).getDate();
  let h=`<div class="calhead"><button class="nav" onclick="mv(-1)">‹</button><b onclick="jump()" style="cursor:pointer">${cy}년 ${cm+1}월</b><button class="nav" onclick="mv(1)">›</button></div>
  <div class="dow">${['월','화','수','목','금','토','일'].map(d=>`<div>${d}</div>`).join('')}</div><div class="grid">`;
  for(let i=0;i<start;i++)h+=`<div class="cell out"></div>`; // 이전 달 날짜는 표시하지 않는다
  for(let d=1;d<=days;d++){
    const ds=`${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,it=ofDay(ds);
    let inner='';
    if(it.length){
      inner=`<div class="imgs ${it.length>=3?'v':''}">${it.slice(0,3).map(x=>`<i class="${x.tbd?'gray':''}" style="background-image:url('${x.img||''}')"></i>`).join('')}</div>`;
      if(it.length>1)inner+=`<div class="cnt">${it.length}</div>`;
    }
    h+=`<button class="cell" onclick="dayTap('${ds}')">${inner}<div class="n">${d}</div></button>`;
  }
  h+='</div>';
  const mo=DB.filter(x=>(x.date||'').startsWith(`${cy}-${String(cm+1).padStart(2,'0')}`));
  h+=`<div class="msum">이번 달 <b>${mo.length}회</b><i></i><b>${won(mo.reduce((s,x)=>s+(+x.price||0),0))}원</b></div>`;
  return h;
}
function mv(n){cm+=n;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}render()}
function years(){
  const s=new Set(DB.map(x=>(x.date||'').slice(0,4)).filter(Boolean));
  s.add(String(new Date().getFullYear()));s.add(String(cy));
  return [...s].sort().reverse();
}
function jump(){
  const ys=years(),now=new Date();
  open(`<div class="mtop"><b>날짜 이동</b><button class="x" onclick="close_()">✕</button></div>
  <div class="ym" style="margin-top:14px">
  <select id="jy">${ys.map(y=>`<option ${+y===cy?'selected':''}>${y}</option>`).join('')}</select>
  <select id="jm">${Array.from({length:12},(_,i)=>`<option value="${i}" ${i===cm?'selected':''}>${i+1}월</option>`).join('')}</select></div>
  <button class="btn" onclick="cy=+document.getElementById('jy').value;cm=+document.getElementById('jm').value;close_();render()">이동</button>
  <button class="btn sub" onclick="cy=${now.getFullYear()};cm=${now.getMonth()};close_();render()">오늘로</button>`);
}
function dayTap(ds){
  const it=ofDay(ds);
  if(!it.length)return openForm(null,ds);
  if(it.length===1)return detail(it[0].id);
  open(`<div class="mtop"><b>${ds}</b><button class="x" onclick="close_()">✕</button></div>
  ${it.map(x=>card(x,1,1)).join('')}<button class="btn sub" onclick="openForm(null,'${ds}')">이 날짜에 추가</button>`);
}
// det=1이면 일시·출연·장소·좌석을 각각 한 줄씩 보여준다(달력 날짜 목록용). 값이 없으면 - 로 자리를 지킨다
function card(x,cp,det){
  const ln=(k,v)=>`<div class="s"><span class="k">${k}</span>${esc(v)||'-'}</div>`;
  const bd=det
    ?`<div class="s"><span class="k">일시</span>${((x.date||'')+' '+(x.time||'')).trim()||'-'}</div>
      ${ln('출연',x.cast)}${ln('장소',x.place)}${ln('좌석',x.seat)}`
    :`<div class="s">${((x.date||'')+' '+(x.time||'')).trim()||'-'}</div>
      <div class="s">${esc(x.cast)||'-'}</div>`;
  return `<div class="card ${det?'det':''}" onclick="detail('${x.id}')">
    <img class="${x.tbd?'gray':''}" src="${x.img||''}" onerror="this.style.visibility='hidden'">
    <div class="bd"><div class="t">${esc(x.title)}</div>${bd}</div>
    ${cp?`<button class="cp" onclick="event.stopPropagation();openForm('${x.id}',null,1)">복사</button>`:''}</div>`;
}

/* ---------- 목록 + 검색/필터 ---------- */
function uniq(k){return [...new Set(DB.map(x=>(x[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'))}
function filtered(){
  const t=q.trim().toLowerCase();
  const r=DB.filter(x=>{
    if(fGenre&&x.genre!==fGenre)return false;
    if(fVendor&&(x.vendor||'').trim()!==fVendor)return false;
    if(fY&&!(x.date||'').startsWith(fY))return false;
    if(!t)return true;
    return ['title','cast','place','seat','vendor','memo','genre'].some(k=>(x[k]||'').toLowerCase().includes(t));
  });
  const S={new:(a,b)=>(b.date||'').localeCompare(a.date||''),old:(a,b)=>(a.date||'').localeCompare(b.date||''),
    hi:(a,b)=>(+b.price||0)-(+a.price||0),name:(a,b)=>(a.title||'').localeCompare(b.title||'','ko')};
  return r.sort(S[fSort]);
}

function pDate(v){
  if(v==null||v==='')return '';
  // SheetJS가 만든 Date는 로컬 기준일(1899-12-30)에서 계산되므로 반드시 로컬 게터로 읽는다
  if(v instanceof Date&&!isNaN(v))return [v.getFullYear(),String(v.getMonth()+1).padStart(2,'0'),String(v.getDate()).padStart(2,'0')].join('-');
  if(typeof v==='number'){
    const d=XLSX.SSF.parse_date_code(v);
    if(d&&d.y)return [d.y,String(d.m).padStart(2,'0'),String(d.d).padStart(2,'0')].join('-');
    return '';
  }
  const s=String(v).trim();
  let m=s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function pTime(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v)){const t=Math.round(v.getHours()*60+v.getMinutes()+v.getSeconds()/60);
    return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
  if(typeof v==='number'){
    const f=v%1,t=Math.round(f*1440);
    return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  }
  const s=String(v).trim();
  let m=s.match(/(오전|오후|AM|PM|am|pm)?\s*(\d{1,2})\s*[:시]\s*(\d{1,2})/);
  if(m){
    let hh=+m[2];const pm=/오후|PM|pm/.test(m[1]||'');
    if(pm&&hh<12)hh+=12; if(/오전|AM|am/.test(m[1]||'')&&hh===12)hh=0;
    return String(hh).padStart(2,'0')+':'+m[3].padStart(2,'0');
  }
  m=s.match(/^(\d{1,2})\s*시$/);
  if(m)return String(+m[1]).padStart(2,'0')+':00';
  return '';
}
// 중복 판정 키: 공연명+날짜+시간 (앞뒤 공백·중복 공백·대소문자 무시)
const dkey=o=>[o.title,o.date,o.time||''].map(s=>String(s).trim().replace(/\s+/g,' ').toLowerCase()).join('|');
function impXls(el){
  const fl=el.files[0];if(!fl)return;
  const r=new FileReader();
  r.onload=async()=>{
    if(!await needXLSX()){el.value='';return}
    let rows;
    try{
      // cellDates를 켜면 날짜가 타임존 영향을 받으므로, 시리얼 숫자 그대로 받아 pDate/pTime에서 변환한다
      const wb=XLSX.read(r.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    }catch(e){el.value='';return alert('엑셀 파일을 읽을 수 없습니다')}
    if(!rows||rows.length<2){el.value='';return alert('내용이 비어 있습니다')}
    // 헤더 위치 찾기
    let hi=rows.findIndex(rw=>rw.some(c=>String(c).trim()==='공연명'));
    if(hi<0)hi=0;
    const head=rows[hi].map(c=>String(c).trim());
    const idx={};COLS.forEach(c=>idx[c]=head.indexOf(c));
    if(idx['공연명']<0){el.value='';return alert('첫 줄에서 "공연명" 열을 찾을 수 없습니다')}
    const get=(rw,c)=>idx[c]>=0?rw[idx[c]]:'';
    const recs=[],bad=[],dup=[];
    const seen=new Set(DB.map(dkey)); // 이미 저장된 기록 + 이번 파일 안의 중복까지 걸러낸다
    for(let i=hi+1;i<rows.length;i++){
      const rw=rows[i];if(!rw||!rw.length)continue;
      const title=String(get(rw,'공연명')??'').trim();
      if(!title)continue;
      const date=pDate(get(rw,'날짜'));
      if(!date){bad.push(`${i+1}행 ${title}`);continue}
      const o={id:'x'+Date.now().toString(36)+i.toString(36)+Math.random().toString(36).slice(2,5),img:'',
        title,date,time:pTime(get(rw,'시간')),
        cast:String(get(rw,'출연')??'').trim(),place:String(get(rw,'장소')??'').trim(),
        seat:String(get(rw,'좌석')??'').trim(),genre:String(get(rw,'장르')??'').trim()||'기타',
        price:String(get(rw,'금액')??'').replace(/[^0-9]/g,''),
        vendor:String(get(rw,'예매처')??'').trim(),memo:String(get(rw,'메모')??'').trim(),
        tbd:isTbd(get(rw,'미정'))};
      const k=dkey(o);
      if(seen.has(k)){dup.push(`${date} ${title}`);continue}
      seen.add(k);recs.push(o);
    }
    el.value='';
    if(!recs.length){
      if(dup.length)return alert(`새로 추가할 기록이 없습니다.\n엑셀의 ${dup.length}건이 모두 이미 등록되어 있습니다.`);
      return alert('불러올 기록이 없습니다.\n날짜 형식을 확인해주세요.');
    }
    let msg=`${recs.length}건을 불러옵니다.`;
    if(dup.length)msg+=`\n\n이미 있어서 제외된 ${dup.length}건:\n`+dup.slice(0,5).join('\n')+(dup.length>5?`\n… 외 ${dup.length-5}건`:'');
    if(bad.length)msg+=`\n\n날짜를 읽을 수 없어 제외된 ${bad.length}건:\n`+bad.slice(0,5).join('\n')+(bad.length>5?`\n… 외 ${bad.length-5}건`:'');
    msg+='\n\n계속할까요?';
    if(!confirm(msg))return;
    let ok=0;
    try{for(const o of recs){await put(o);DB.push(o);ok++}}
    catch(e){alert(`${ok}건까지 저장한 뒤 오류가 발생했습니다.`);render();return}
    render();
    alert(`${ok}건을 불러왔습니다.`);
  };
  r.readAsArrayBuffer(fl);
}
async function xlsx(){
  if(!DB.length)return alert('기록이 없습니다');
  if(!await needXLSX())return;
  const rows=DB.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(x=>({
    '공연명':x.title,'날짜':x.date,'시간':x.time,'출연':x.cast,'장소':x.place,
    '좌석':x.seat,'장르':x.genre,'금액':+x.price||0,'예매처':x.vendor,'메모':x.memo,'미정':x.tbd?'O':''}));
  const ws=XLSX.utils.json_to_sheet(rows,{header:COLS});
  ws['!cols']=[{wch:26},{wch:12},{wch:8},{wch:20},{wch:20},{wch:14},{wch:10},{wch:12},{wch:14},{wch:30},{wch:8}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'관람기록');
  XLSX.writeFile(wb,`관람기록_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function backup(){
  if(!DB.length)return alert('기록이 없습니다');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));
  a.download=`관람기록_백업_${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function restore(el){
  const fl=el.files[0];if(!fl)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d))throw 0;
      const merge=confirm(d.length+'건을 불러옵니다.\n\n확인 = 현재 기록에 합치기\n취소 = 전체 교체');
      if(!merge){for(const x of DB)await rm(x.id);DB=[]}
      const ids=new Set(DB.map(x=>x.id));
      for(const x of d)if(x&&x.id&&!ids.has(x.id)){await put(x);DB.push(x);ids.add(x.id)}
      render();alert('불러오기 완료');
    }catch(e){alert('올바른 백업 파일이 아닙니다')}
    el.value='';
  };r.readAsText(fl);
}

/* ---------- 모달 ---------- */
function open(h){
  const m=document.getElementById('modal');
  document.getElementById('mbody').innerHTML=h;
  m.classList.add('on');
  m.scrollTop=0; // 모달은 자체 스크롤 컨테이너라, 이전에 내려둔 위치가 그대로 남는다
  window.scrollTo(0,0);
}
function close_(){document.getElementById('modal').classList.remove('on')}

/* ---------- 홈 화면 앱 여부 판정 ---------- */
if(navigator.standalone||matchMedia('(display-mode: standalone)').matches
   ||matchMedia('(display-mode: fullscreen)').matches)
  document.documentElement.classList.add('pwa');

/* ---------- 달력 좌우 스와이프 ---------- */
(function(){
  const el=document.getElementById('app');
  let x0=0,y0=0,on=false,swiped=false;
  el.addEventListener('touchstart',e=>{
    on=tab===0&&e.touches.length===1;
    if(on){x0=e.touches[0].clientX;y0=e.touches[0].clientY}
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!on)return;on=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    // 가로 이동이 60px 넘고, 세로 이동보다 확실히 커야 달 이동으로 본다(스크롤과 구분)
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
    swiped=true;setTimeout(()=>swiped=false,400);
    mv(dx<0?1:-1);
  },{passive:true});
  // 스와이프로 끝난 터치가 날짜 버튼 클릭으로 이어지지 않게 막는다
  el.addEventListener('click',e=>{if(swiped){swiped=false;e.stopPropagation();e.preventDefault()}},true);
})();
load();
</script>
